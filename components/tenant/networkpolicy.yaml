apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tenant
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: monitoring
