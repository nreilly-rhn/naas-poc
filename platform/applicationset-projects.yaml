apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: naas-tenant-projects
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/nreilly-rhn/naas-poc.git
        revision: main
        files:
          - path: tenants/*/tenant.yaml
  template:
    metadata:
      name: "{{.name}}-argocd"
      labels:
        naas.naramajac.xyz/tenant: "{{.name}}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: naas-control
      source:
        repoURL: https://github.com/nreilly-rhn/naas-poc.git
        targetRevision: main
        path: "tenants/{{.path.basename}}/argocd"
      destination:
        server: https://kubernetes.default.svc
        namespace: openshift-gitops
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=false
