apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: naas-platform
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/nreilly-rhn/naas-poc.git
    targetRevision: main
    path: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
